name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: Core (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # No Android SDK on this job on purpose: it proves the core still builds and tests without
      # one, which is what keeps unit tests runnable anywhere.
      - name: Test
        run: ./gradlew --no-daemon test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Sets ANDROID_HOME for the steps below, which is what makes settings.gradle.kts include
      # the Android modules. Asking for :app:assembleDebug by name means a missing SDK fails the
      # job instead of silently building nothing.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew --no-daemon :data:audio:assembleDebug :app:assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: 'app/build/reports/lint-results-*.html'
          if-no-files-found: ignore
